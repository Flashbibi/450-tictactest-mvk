plugins {
	id 'java'
	id 'application'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
}

// Version der Anwendung (MAJOR.MINOR.PATCH), siehe RELEASE.md. Der Release-Tag ist "v" + diese Version
version = '1.0.1'

repositories {
	mavenCentral()
}

dependencies {
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
	testImplementation 'org.junit-pioneer:junit-pioneer:2.3.0'
	testImplementation 'com.tngtech.archunit:archunit-junit6:1.5.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform {
		excludeTags 'e2e' // die End-to-End-Tests laufen im eigenen Task e2eTest
	}
	testLogging {
		events 'passed', 'failed'
	}
	finalizedBy jacocoTestReport
}

// End-to-End-Tests: ganze Spiele über main(...), ./gradlew e2eTest, Report unter build/reports/tests/e2eTest
tasks.register('e2eTest', Test) {
	description = 'Runs the end-to-end tests: complete games with keyboard input and console output.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'e2e'
	}
	testLogging {
		events 'passed', 'failed'
	}
	shouldRunAfter test
}

check.dependsOn e2eTest

jacoco {
	toolVersion = '0.8.16'
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
	}
}

// Der Build schlägt fehl, wenn die Branch Coverage unter 90 % liegt
jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			limit {
				counter = 'BRANCH'
				minimum = 0.90
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification

// Mutation Testing: ./gradlew pitest, Report unter build/reports/pitest/index.html
pitest {
	pitestVersion = '1.30.1'
	junit5PluginVersion = '1.2.3'
	targetClasses = ['ch.bbw.m450.tictactoe.*']
	excludedTestClasses = ['ch.bbw.m450.tictactoe.ArchitectureTest'] // prüft nur Abhängigkeiten, keine Logik
	excludedGroups = ['e2e'] // Mutation Testing nur mit den Unit-Tests
	timestampedReports = false
}

application {
	mainClass = 'ch.bbw.m450.tictactoe.TicTacToeMain'
}

// Ausführbares JAR: Mit der Main-Class im Manifest startet "java -jar tictactest-<Version>.jar" das Spiel
jar {
	manifest {
		attributes 'Main-Class': application.mainClass.get()
	}
}

run {
	standardInput = System.in
}
