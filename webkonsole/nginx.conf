# nginx vor der Web-Konsole: eine Adresse für das Terminal und für die Version.
# start.sh startet nginx als normaler Benutzer. Darum schreibt nginx alles in den Arbeitsordner
# (Option -p) und nichts nach /var oder /run.
worker_processes 1;
pid nginx.pid;
error_log stderr;

events {}

http {
    access_log off;

    # Ordner für Zwischendateien, ebenfalls im Arbeitsordner
    client_body_temp_path tmp;
    proxy_temp_path tmp;
    fastcgi_temp_path tmp;
    uwsgi_temp_path tmp;
    scgi_temp_path tmp;

    server {
        listen 8080;

        # Die Version des laufenden Backends. start.sh schreibt sie in den Arbeitsordner.
        # Der CORS-Header erlaubt dem Frontend auf einem anderen Port, sie zu lesen.
        location = /version.txt {
            root .;
            default_type text/plain;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control no-store;
        }

        # Alles andere geht an ttyd: die Seite mit dem Terminal und die WebSocket-Verbindung.
        # Upgrade und Connection braucht es, damit aus der HTTP-Anfrage eine WebSocket-Verbindung wird.
        location / {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection upgrade;
        }
    }
}
