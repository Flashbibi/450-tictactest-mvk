name: release

# Ein Release entsteht nur, wenn ein Tag v* gepusht wird, nie bei einem normalen Push auf main. Siehe RELEASE.md
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release erstellen und JAR hochladen

    steps:
      - uses: actions/checkout@v7

      - name: Java installieren
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'

      - name: Version und CHANGELOG pruefen
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -q "^version = '$version'$" build.gradle || { echo "build.gradle hat nicht die Version $version"; exit 1; }
          grep -q "^## $version " CHANGELOG.md || { echo "CHANGELOG.md hat keinen Eintrag für $version"; exit 1; }

      - name: Tests ausfuehren
        run: ./gradlew check

      - name: JAR bauen
        run: ./gradlew jar

      # Zweites Artefakt: das Frontend als ZIP. Im Repository steht in version.txt "dev", im ZIP die Version des Tags
      - name: Frontend-Archiv bauen
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "$version" > frontend/version.txt
          cd frontend
          zip -r "../build/tictactest-frontend-$version.zip" .

      - name: GitHub Release erstellen, JAR und Frontend anhaengen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          {
            echo "Release: TicTacTest $GITHUB_REF_NAME"
            echo ""
            echo "Tag: $GITHUB_REF_NAME"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "Änderungen:"
            # der Abschnitt dieser Version aus CHANGELOG.md, bis zur nächsten Überschrift "## "
            awk -v v="$version" '$1 == "##" { inside = ($2 == v); next } inside' CHANGELOG.md
            echo ""
            echo "Artefakte: tictactest-$version.jar, tictactest-frontend-$version.zip"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "build/libs/tictactest-$version.jar" "build/tictactest-frontend-$version.zip" \
            --title "TicTacTest $GITHUB_REF_NAME" --notes-file notes.md

  # Auftrag 3: Was hat sich seit dem vorherigen Release geändert? Verglichen wird mit dem vorherigen Release-Tag,
  # nicht mit dem letzten Commit. Regeln in scripts/changes.sh und docs/deployment.md
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.diff.outputs.version }}
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # die ganze Historie mit allen Tags, sonst findet git describe den vorherigen Release nicht

      - name: Geänderte Teile seit dem vorherigen Release
        id: diff
        run: |
          set -o pipefail # schlägt changes.sh fehl, soll der Job fehlschlagen und nicht still nichts deployen
          {
            echo "version=${GITHUB_REF_NAME#v}"
            scripts/changes.sh "$GITHUB_REF_NAME"
          } | tee -a "$GITHUB_OUTPUT"

  # Nach dem Release nur die geänderten Teile deployen. Hat sich weder Backend noch Frontend geändert, entfällt der Job.
  # Der Deploy-Workflow steht in deploy.yml, damit er auch von Hand mit einer beliebigen Version läuft
  deploy:
    needs: [release, changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.changes.outputs.version }}
      backend: ${{ needs.changes.outputs.backend == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
    secrets: inherit
