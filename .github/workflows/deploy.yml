name: deploy

# Auftrag 3: bringt einen veröffentlichten Release auf die Infrastruktur aus infra/. Gebaut wird hier nichts, deployt
# werden die Dateien aus dem GitHub-Release. Die Schritte sind dieselben wie in docs/deployment.md.
# Zwei Auslöser:
# - release.yml ruft diesen Workflow nach jedem Release auf, nur für die Teile, die sich seit dem vorherigen Release
#   geändert haben (scripts/changes.sh)
# - von Hand über "Run workflow" mit einer Version: deployt Backend und Frontend dieser Version, z.B. für einen Rollback
on:
  workflow_call:
    inputs:
      version:
        description: Version ohne v, z.B. 1.3.0
        type: string
        required: true
      backend:
        type: boolean
        required: true
      frontend:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version, die deployt werden soll, ohne v (z.B. 1.2.0)
        type: string
        required: true

permissions:
  contents: read # Dateien des Releases herunterladen

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Nie zwei Deployments gleichzeitig: Ein zweites wartet, bis das erste fertig ist
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
      # Von Hand wird immer beides deployt, nach einem Release nur, was sich geändert hat
      BACKEND: ${{ github.event_name == 'workflow_dispatch' || inputs.backend }}
      FRONTEND: ${{ github.event_name == 'workflow_dispatch' || inputs.frontend }}
      # Die Outputs von OpenTofu als GitHub Variables. Sie sind nicht geheim (siehe docs/deployment.md)
      AWS_DEFAULT_REGION: ${{ vars.REGION }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      WEB_CONSOLE_URL: ${{ vars.WEB_CONSOLE_URL }}
      VERSION_URL: ${{ vars.VERSION_URL }}

    steps:
      - name: Version und Variables prüfen
        run: |
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV" # auch wenn jemand von Hand v1.2.0 eingibt
          echo "Version ${VERSION#v}, Backend: $BACKEND, Frontend: $FRONTEND"
          for name in AWS_DEFAULT_REGION INSTANCE_ID ARTIFACTS_BUCKET FRONTEND_BUCKET FRONTEND_URL WEB_CONSOLE_URL VERSION_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name ist leer. Nach tofu apply scripts/github-variables.sh ausführen"
              exit 1
            fi
          done

      # Die AWS-Zugangsdaten bekommen nur die drei Schritte, die AWS brauchen, nicht der ganze Job
      - name: AWS-Zugangsdaten prüfen
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          # Nur prüfen, nichts ausgeben: Die Antwort enthält den Namen des Lab-Benutzers
          if ! aws sts get-caller-identity > /dev/null; then
            echo "::error::AWS-Zugangsdaten fehlen oder sind abgelaufen. Learner Lab starten, scripts/github-secrets.sh ausführen und diesen Lauf mit 'Re-run jobs' wiederholen"
            exit 1
          fi
          echo "AWS-Zugangsdaten gültig"

      - name: Release herunterladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir release
          ls -l release

      # ---- Backend ----

      - name: Java installieren, für den Starttest
        if: env.BACKEND == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'

      - name: Starttest des JARs
        if: env.BACKEND == 'true'
        run: |
          # Das JAR aus dem Release bekommt eine leere Eingabe. Ein lauffähiges Spiel zeigt das Spielfeld und fragt nach
          # dem ersten Zug. So fällt ein kaputtes JAR auf, bevor es auf die Instanz kommt
          output=$(echo | timeout 30 java -jar "release/tictactest-$VERSION.jar" 2>&1 || true)
          head -n 4 <<< "$output" # Spielfeld und Frage, danach endet das Spiel an der leeren Eingabe
          if ! grep -q "where to put the next" <<< "$output"; then
            echo "::error::Das JAR aus Release v$VERSION startet nicht. Nichts wurde deployt, die bisherige Version läuft weiter"
            exit 1
          fi

      - name: Backend deployen
        if: env.BACKEND == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          # JAR und Version in den privaten Bucket. Der Dienst holt beides vor jedem Start (ExecStartPre)
          aws s3 cp --only-show-errors "release/tictactest-$VERSION.jar" "s3://$ARTIFACTS_BUCKET/backend/tictactest.jar"
          echo "$VERSION" | aws s3 cp --only-show-errors - "s3://$ARTIFACTS_BUCKET/backend/version.txt"

          # Dienst über SSM neu starten, ohne SSH. wait bricht ab, wenn der Befehl auf der Instanz fehlschlägt
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["systemctl restart tictactest"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          echo "Dienst neu gestartet"

      - name: Version des Backends prüfen
        if: env.BACKEND == 'true'
        run: |
          # Die Instanz muss innerhalb von 60 Sekunden genau die neue Version melden
          for attempt in $(seq 30); do
            running=$(curl -fs --max-time 5 "$VERSION_URL" || true)
            if [ "$running" = "$VERSION" ]; then
              echo "Backend läuft mit Version $running"
              exit 0
            fi
            sleep 2
          done
          echo "::error::$VERSION_URL meldet '$running' statt $VERSION"
          exit 1

      # ---- Frontend ----

      - name: Frontend deployen
        if: env.FRONTEND == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          unzip -q "release/tictactest-frontend-$VERSION.zip" -d frontend
          # 1. Alle Dateien hochladen, ausser config.js: Die richtige schreibt OpenTofu mit der Adresse der Instanz
          aws s3 cp --only-show-errors --recursive frontend/ "s3://$FRONTEND_BUCKET/" --exclude config.js --cache-control no-cache
          # 2. Dateien löschen, die es in dieser Version nicht mehr gibt. --exclude schützt config.js auch vor dem Löschen
          aws s3 sync --delete frontend/ "s3://$FRONTEND_BUCKET/" --exclude config.js --cache-control no-cache

      - name: Frontend prüfen
        if: env.FRONTEND == 'true'
        run: |
          shown=$(curl -fs --max-time 10 "$FRONTEND_URL/version.txt" || true)
          if [ "$shown" != "$VERSION" ]; then
            echo "::error::Das Frontend meldet '$shown' statt $VERSION"
            exit 1
          fi
          if ! curl -fs --max-time 10 "$FRONTEND_URL/config.js" | grep -qF "$WEB_CONSOLE_URL"; then
            echo "::error::config.js zeigt nicht mehr auf $WEB_CONSOLE_URL"
            exit 1
          fi
          echo "Frontend liefert Version $shown, config.js zeigt weiterhin auf $WEB_CONSOLE_URL"

      - name: Zusammenfassung
        run: |
          {
            echo "### Deployment v$VERSION"
            echo ""
            echo "| Auslöser | Backend deployt | Frontend deployt |"
            echo "|---|---|---|"
            echo "| $GITHUB_EVENT_NAME | $BACKEND | $FRONTEND |"
            echo ""
            echo "Spielen: $FRONTEND_URL"
          } >> "$GITHUB_STEP_SUMMARY"
